spring.application.name=spring-hibernate-dao
server.port=8080

# PostgreSQL в Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate создаст таблицу persons, если её нет, и не тронет существующую
spring.jpa.hibernate.ddl-auto=update
# Показывать SQL, который генерирует Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Выполнить data.sql (тестовые данные) после того, как Hibernate создаст таблицу
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
